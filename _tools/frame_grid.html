<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>frame_grid</title></head>
<body style="background:#333;margin:0">
<div id="out" style="color:#0f0;font-family:monospace;font-size:11px;white-space:pre-wrap"></div>
<canvas id="c" style="background:repeating-conic-gradient(#666 0% 25%, #999 0% 50%) 0 0/20px 20px;display:block"></canvas>
<script>
const params = new URLSearchParams(location.search);
const dir = params.get('dir');
const count = parseInt(params.get('count'));
const cols = parseInt(params.get('cols') || '6');
const cellH = parseInt(params.get('cellH') || '260');

function loadImg(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error(src)); img.src = src; });
}

async function run() {
  const imgs = [];
  for (let i = 0; i < count; i++) imgs.push(await loadImg(`${dir}/${i}.webp?t=${Date.now()}`));
  const rows = Math.ceil(count / cols);
  const cellW = 220;
  const canvas = document.getElementById('c');
  canvas.width = cols * cellW; canvas.height = rows * (cellH + 20);
  const ctx = canvas.getContext('2d');
  for (let i = 0; i < imgs.length; i++) {
    const img = imgs[i];
    const col = i % cols, row = (i / cols) | 0;
    const x = col * cellW, y = row * (cellH + 20);
    const drawH = cellH - 10;
    const drawW = drawH * (img.width / img.height);
    ctx.strokeStyle = '#0f0'; ctx.strokeRect(x, y, cellW, cellH);
    ctx.drawImage(img, x + 5, y + 5, drawW, drawH);
    ctx.fillStyle = '#0f0'; ctx.font = '12px monospace';
    ctx.fillText(`${i}: ${img.width}x${img.height}`, x + 5, y + cellH + 14);
  }
}
run();
</script>
</body></html>
