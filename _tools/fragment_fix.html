<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fragment_fix</title></head>
<body style="background:#222;color:#0f0;font-family:monospace;white-space:pre-wrap;font-size:12px">
<div id="out">loading...</div>
<script>
const params = new URLSearchParams(location.search);
const src = params.get('src');
const boxes = params.get('boxes').split(';').map(b => b.split(',').map(Number));
const pad = parseInt(params.get('pad') || '0');
const save = params.get('save') || src;

function loadImg(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; });
}

async function run() {
  const img = await loadImg(src);
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, img.width, img.height);
  const d = data.data;
  for (const [bx0, by0, bx1, by1] of boxes) {
    const x0 = Math.max(0, bx0 - pad), y0 = Math.max(0, by0 - pad);
    const x1 = Math.min(img.width, bx1 + pad), y1 = Math.min(img.height, by1 + pad);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const i = (y * img.width + x) * 4;
      d[i] = d[i+1] = d[i+2] = d[i+3] = 0;
    }
  }
  ctx.putImageData(data, 0, 0);
  const blob = await new Promise(res => c.toBlob(res, 'image/webp', 1.0));
  const resp = await fetch('/save?path=' + encodeURIComponent(save), { method: 'POST', body: blob });
  const text = await resp.text();
  document.getElementById('out').textContent = `erased ${boxes.length} box(es) from ${src} -> ${save} :: ${resp.status} ${text}`;
}
run();
</script>
</body></html>
