<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>batch_pad</title></head>
<body style="background:#222;color:#0f0;font-family:monospace;white-space:pre-wrap;font-size:12px">
<div id="out">loading...</div>
<script>
const params = new URLSearchParams(location.search);
const jobs = params.get('jobs').split(';').map(j => {
  const [src, newH, save] = j.split('|');
  return { src, newH: parseInt(newH), save };
});

function loadImg(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; });
}

async function run() {
  const lines = [];
  for (const job of jobs) {
    try {
      const img = await loadImg(job.src);
      const padTop = job.newH - img.height;
      const c = document.createElement('canvas');
      c.width = img.width; c.height = job.newH;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, padTop);
      const blob = await new Promise(res => c.toBlob(res, 'image/webp', 1.0));
      const resp = await fetch('/save?path=' + encodeURIComponent(job.save), { method: 'POST', body: blob });
      const text = await resp.text();
      lines.push(`${job.save}: padTop=${padTop} newSize=${c.width}x${c.height} :: ${resp.status} ${text}`);
    } catch (e) {
      lines.push(`${job.save}: ERROR ${e}`);
    }
    document.getElementById('out').textContent = lines.join('\n');
  }
}
run();
</script>
</body></html>
