<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>overlay</title></head>
<body style="background:#333;margin:0;color:#0f0;font-family:monospace">
<div id="info"></div>
<canvas id="c" style="background:#000;display:block"></canvas>
<script>
const params = new URLSearchParams(location.search);
const refSrc = params.get('ref');
const candSrc = params.get('cand');
const H = parseInt(params.get('H') || '400');
const scale = parseFloat(params.get('scale') || '1.0'); // extra scale applied to candidate
function loadImg(src) { return new Promise((res) => { const img = new Image(); img.onload = () => res(img); img.src = src; }); }
async function run() {
  const ref = await loadImg(refSrc + '?t=' + Date.now());
  const cand = await loadImg(candSrc + '?t=' + Date.now());
  const c = document.getElementById('c');
  c.width = 500; c.height = H + 20;
  const ctx = c.getContext('2d');
  const floorY = H + 10;
  // draw ref anchored at floor, centered horizontally
  const refW = H * (ref.width/ref.height);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(ref, 250 - refW/2, floorY - H, refW, H);
  // draw candidate with extra scale, also floor-anchored+centered, using difference blend
  const candH = H * scale;
  const candW = candH * (cand.width/cand.height);
  ctx.globalCompositeOperation = 'difference';
  ctx.globalAlpha = 1;
  ctx.drawImage(cand, 250 - candW/2, floorY - candH, candW, candH);
  document.getElementById('info').textContent = `ref drawn at H=${H}, candidate at H=${candH.toFixed(1)} (scale=${scale}) -- dark/black = aligned, bright ghosting = mismatch`;
}
run();
</script>
</body></html>
